name: Fallo / Bug report
description: Algo no funciona como debería / Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: que_pasa
    attributes:
      label: Qué pasa / What happens
      description: Describe el fallo. / Describe the bug.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo / Steps to reproduce
      placeholder: |
        1. Abrir la pestaña Puertos / Open the Ports tab
        2. …
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas / Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de la app / App version
      description: Aparece junto al título, por ejemplo v0.3.0. / Shown next to the title, e.g. v0.3.0.
      placeholder: v0.3.0
    validations:
      required: true
  - type: dropdown
    id: sistema
    attributes:
      label: Sistema operativo / Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Linux
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Capturas o detalles / Screenshots or details
      description: Quita la información personal de las capturas. / Remove personal information from screenshots.
